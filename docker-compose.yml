services:
  db:
    image: postgres:16-alpine
    container_name: chartersense_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chartersense}
      POSTGRES_USER: ${POSTGRES_USER:-chartersense_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chartersense_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/roles.sql:/docker-entrypoint-initdb.d/02_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chartersense_admin} -d ${POSTGRES_DB:-chartersense}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chartersense_pgdata:
